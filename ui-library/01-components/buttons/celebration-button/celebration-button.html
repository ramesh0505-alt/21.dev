<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Button</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: #090909;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.animated-btn {
    position: relative;
    border: none;
    outline: none;
    background: #eeeeee;
    color: #111;
    padding: 14px 24px;
    border-radius: 13px;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    transition: transform 0.15s ease;
}

.animated-btn:hover {
    transform: translateY(-2px);
}

.animated-btn:active {
    transform: scale(0.94);
}

.particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 2px;
    pointer-events: none;
    animation: explode 900ms ease-out forwards;
}

@keyframes explode {
    0% {
        opacity: 1;
        transform:
            translate(0, 0)
            rotate(0deg)
            scale(1);
    }

    100% {
        opacity: 0;
        transform:
            translate(var(--x), var(--y))
            rotate(var(--rotation))
            scale(0.2);
    }
}

.animated-btn::after {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: inherit;
    pointer-events: none;
    opacity: 0;
    box-shadow: 0 0 30px rgba(255,255,255,0.4);
}

.animated-btn.active::after {
    animation: glow 600ms ease-out;
}

@keyframes glow {
    0% {
        opacity: 0.8;
    }

    100% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<button class="animated-btn" onclick="animateButton(this)">
    Level Up!
</button>

<script>
function animateButton(button) {

    button.classList.remove("active");

    void button.offsetWidth;

    button.classList.add("active");

    for (let i = 0; i < 35; i++) {

        const particle = document.createElement("span");

        particle.className = "particle";

        const angle = Math.random() * Math.PI * 2;

        /* Increased animation area */
        const distance = 60 + Math.random() * 100;

        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        const rotation = Math.random() * 360;

        particle.style.setProperty("--x", `${x}px`);
        particle.style.setProperty("--y", `${y}px`);
        particle.style.setProperty(
            "--rotation",
            `${rotation}deg`
        );

        const colors = [
            "#ffffff",
            "#8b5cf6",
            "#22c55e",
            "#f59e0b",
            "#ef4444"
        ];

        particle.style.background =
            colors[Math.floor(Math.random() * colors.length)];

        button.appendChild(particle);

        setTimeout(() => {
            particle.remove();
        }, 950);
    }
}
</script>

</body>
</html>
